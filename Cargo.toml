[package]
name = "minio-rs"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "minio"
path = "src/main.rs"

[lib]
name = "server"
path = "src/lib.rs"

[workspace]
resolver = "2"
members = [
    "base",
    "storage",
    "erasure",
    "object",
    "iam",
    "grid",
    "s3",
]

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"         # MessagePack (xl.meta 格式)
rmpv = "1"              # MessagePack 值操作
serde_bytes = "0.11"    # serde bytes 序列化优化

# XML serialization (S3 response)
quick-xml = { version = "0.36", features = ["serialize"] }

# 哈希
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
siphasher = "1"         # SipHash-2-4 (对象→Set 路由)
highway = "0.8"          # HighwayHash (per-shard bitrot 校验)

# Erasure Coding
reed-solomon-erasure = "6"

# HTTP (Phase 1+)
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1"
bytes = "1"

# gRPC (Phase 2)
tonic = "0.12"
prost = "0.13"

# JWT (Phase 3)
jsonwebtoken = "9"

# 工具
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"

# CLI (main binary)
clap = { version = "4", features = ["derive"] }

# workspace 内部 crate
base = { path = "base" }
storage = { path = "storage" }
erasure = { path = "erasure" }
object = { path = "object" }
iam = { path = "iam" }
grid = { path = "grid" }
s3 = { path = "s3" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# === Root package dependencies (binary + library) ===

[dependencies]
base = { workspace = true }
storage = { workspace = true }
erasure = { workspace = true }
object = { workspace = true }
s3 = { workspace = true }
iam = { workspace = true }
grid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
axum = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
chrono = { workspace = true }
reqwest = { version = "0.12" }
tempfile = "3"
