[package]
name = "minio-rs"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "minio"
path = "src/main.rs"

[lib]
name = "minio_rs"
path = "src/lib.rs"

# ========== All dependencies declared once ==========

[dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rmpv = "1"
serde_bytes = "0.11"

# XML (S3 response)
quick-xml = { version = "0.36", features = ["serialize"] }

# 哈希
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
siphasher = "1"
highway = "0.8"

# Erasure Coding
reed-solomon-erasure = "6"

# HTTP
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1"
bytes = "1"

# Grid RPC (WebSocket transport)
bitflags = { version = "2", features = ["serde"] }
tokio-tungstenite = { version = "0.24" }
futures-util = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Auth
jsonwebtoken = "9"
hmac = "0.12"

# 文件锁
fs2 = "0.4"

# 指标
prometheus = "0.14"

# 工具
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

# OS bindings (signal handling on Linux, memory info on macOS/Linux)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.12" }
tempfile = "3"

[workspace]
members = ["s3perf", "crates/mcp-server"]
default-members = [".", "s3perf"]
